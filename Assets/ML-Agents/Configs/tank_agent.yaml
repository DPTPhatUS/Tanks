behaviors:
  TankAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 32768
      learning_rate: 3.0e-4
      beta: 2.5e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 25000000
    time_horizon: 256
    summary_freq: 20000
    checkpoint_interval: 1000000
    keep_checkpoints: 10
    threaded: true
    self_play:
      save_steps: 200000
      team_change: 200000
      swap_steps: 100000
      play_against_latest_model_ratio: 0.6
      window: 10
      initial_elo: 1200
      elo_reset: false
